name: Deploy site to VPS

# Standards-based CI/CD: every push to `main` that touches the site rebuilds the
# legal pages from content/, rsyncs site/ to the VPS web root, AND ships the repo
# Caddyfile to /etc/caddy + reloads Caddy — all over SSH. Prod always equals
# `main` — no manual rsync, no laptop dependency. The deploy key lives in GitHub
# Secrets (DEPLOY_*), the server only holds the matching public key authorized
# for an unprivileged `deploy` user that owns the web root. The Caddyfile install
# runs via ONE scoped sudo wrapper (tools/vps/fp-deploy-caddy.sh) — CI never gets
# blanket root, and a bad Caddyfile auto-rolls-back. One-time enablement of that
# wrapper: tools/vps/README.md.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'content/**'
      - 'data/**'
      - 'tools/build-legal.mjs'
      - 'Caddyfile'
      - 'tools/vps/fp-deploy-caddy.sh'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build legal pages from content/
        run: node tools/build-legal.mjs

      - name: Deploy site/ to VPS (rsync over SSH, exact mirror)
        uses: easingthemes/ssh-deploy@v6.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          TARGET: ${{ secrets.DEPLOY_TARGET }}
          SOURCE: 'site/'
          ARGS: '-rlptDvz --delete'
          EXCLUDE: '.git/, .github/'

      # Ship the Caddyfile too: scp it into a deploy-owned staging dir, then run the
      # root-owned wrapper (scoped sudo) which validates, installs to
      # /etc/caddy/Caddyfile and reloads — auto-rolling-back on failure. Runs AFTER
      # the site rsync so redirect targets (e.g. /driftora/*) already exist.
      # Plain scp+ssh (not the rsync action) so a failed validate/reload — or a
      # missing one-time setup, tools/vps/README.md — fails THIS step loudly,
      # instead of being swallowed and only surfacing in the smoke-check.
      - name: Deploy Caddyfile to VPS + reload (scoped sudo wrapper)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          scp $SSH_OPTS Caddyfile "$DEPLOY_USER@$DEPLOY_HOST:/var/www/family-pie/caddy-staging/Caddyfile"
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" 'sudo -n /usr/local/bin/fp-deploy-caddy'

      - name: Smoke-check live routes
        run: |
          set -euo pipefail
          # final status after following redirects (expects 200)
          code() { curl -s -o /dev/null -w '%{http_code}' -L --max-time 15 "$1"; }
          # raw status without following (to assert a redirect)
          raw() { curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$1"; }

          for url in \
            'https://family-pie.ru/' \
            'https://family-pie.ru/driftora/legal' \
            'https://family-pie.ru/driftora/terms' \
            'https://family-pie.ru/driftora/privacy' \
            'https://family-pie.ru/privacy' \
            'https://family-pie.ru/terms' \
            'https://family-pie.ru/driftora/subscription/' \
            'https://family-pie.ru/driftora/subscription/done' \
            'https://family-pie.ru/relo_dojo/checkout/' \
            'https://family-pie.ru/relo_dojo/terms' \
            'https://food.family-pie.ru/health'; do
            c=$(code "$url"); echo "$c  $url"; test "$c" = 200
          done

          # legacy legal path must permanently redirect to /driftora/* (not soft-404)
          for url in \
            'https://family-pie.ru/health_routine/legal' \
            'https://family-pie.ru/health_routine/privacy'; do
            c=$(raw "$url"); echo "$c  (redirect) $url"; test "$c" = 301
          done

          # The purchase page is the one page where being down costs money, and the
          # one whose price block depends on the food service answering. A 200 here
          # is not proof it can sell — that needs /billing/plans — so check both.
          plans=$(curl -s --max-time 15 https://food.family-pie.ru/billing/plans)
          echo "$plans" | grep -q '"plans"' || { echo "billing/plans did not answer with plans: $plans"; exit 1; }
          echo "  plans OK  $(echo "$plans" | head -c 80)"

          echo 'smoke OK — driftora 200, subscription 200, legacy 301, apex aliases 200, food 200'
